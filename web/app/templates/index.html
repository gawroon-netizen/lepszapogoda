{% extends "base.html" %}
{% block head %}
  <link rel="stylesheet" href="{{ asset('vendor/maplibre/maplibre-gl.css') }}">
{% endblock %}
{% block body_class %}page-map{% endblock %}
{% block body %}
<div id="map" aria-label="Mapa Polski" data-places="{{ asset('data/places-pl.json') }}"></div>

<a class="logo" href="/">lepsza<b>pogoda</b>.pl</a>

<div class="layer-switch" role="group" aria-label="Warstwa mapy">
  <button type="button" data-layer="map" class="active">{{ T.layer_map }}</button>
  <button type="button" data-layer="sat">{{ T.layer_sat }}</button>
</div>

<form class="search" id="search" role="search" autocomplete="off">
  <input id="place" type="search" placeholder="{{ T.search_placeholder }}" aria-label="{{ T.search_placeholder }}"
         aria-controls="suggestions" aria-expanded="false">
  <button type="submit" id="go" class="go" aria-label="{{ T.show_forecast }}" title="{{ T.show_forecast }}" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <ul id="suggestions" role="listbox" hidden></ul>
  <noscript><p class="nojs">Mapa i wyszukiwarka wymagają JavaScriptu.</p></noscript>
</form>

<a class="about-link" href="/o-projekcie">{{ T.about }}</a>

<script src="{{ asset('vendor/maplibre/maplibre-gl.js') }}"></script>
<script src="{{ asset('js/map.js') }}"></script>
{% endblock %}

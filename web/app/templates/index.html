{% extends "base.html" %}
{% block head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/maplibre/maplibre-gl.css') }}">
{% endblock %}
{% block body_class %}page-map{% endblock %}
{% block body %}
<div id="map" aria-label="Mapa Polski"></div>

<a class="logo" href="/">lepsza<b>pogoda</b>.pl</a>

<div class="layer-switch" role="group" aria-label="Warstwa mapy">
  <button type="button" data-layer="map" class="active">{{ T.layer_map }}</button>
  <button type="button" data-layer="sat">{{ T.layer_sat }}</button>
</div>

<section class="panel" aria-labelledby="question">
  <div class="search">
    <input id="place" type="search" autocomplete="off" placeholder="{{ T.search_placeholder }}"
           aria-label="{{ T.search_placeholder }}" aria-controls="suggestions" aria-expanded="false">
    <ul id="suggestions" role="listbox" hidden></ul>
  </div>
  <button type="button" id="locate" class="link">{{ T.use_location }}</button>
  <h1 id="question">{{ T.question }}</h1>
  <div class="modes">
    {% for key, label in modes.items() %}
      <a class="mode mode-{{ key }} disabled" data-mode="{{ key }}" aria-disabled="true" href="#">{{ label }}</a>
    {% endfor %}
  </div>
  <p id="hint" class="hint">{{ T.pick_first }}</p>
  <noscript><p class="hint">Mapa i wyszukiwarka wymagają JavaScriptu.</p></noscript>
</section>

<a class="about-link" href="/o-projekcie">{{ T.about }}</a>

<script src="{{ url_for('static', filename='vendor/maplibre/maplibre-gl.js') }}"></script>
<script src="{{ url_for('static', filename='js/map.js') }}"></script>
{% endblock %}

name: setup-check

# Verifies that repository secrets work (R2, Earth Engine) without printing them. Run from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/setup-check.yml", "tools/check_setup.py"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_KEY: ${{ secrets.R2_KEY }}
      R2_SECRET: ${{ secrets.R2_SECRET }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-pipeline.txt -e .
      - name: secrets present and well-formed
        run: python -m tools.check_setup secrets
      - name: R2 put-get-delete
        if: success() || failure()
        run: python -m tools.check_setup r2
      - name: Earth Engine service account
        if: success() || failure()
        run: python -m tools.check_setup gee

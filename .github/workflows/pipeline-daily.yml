name: pipeline-daily

# Once a day: daily Tmax/Tmin from the hourly IMGW polls, IMGW monthly archives, IMGW automatic stations
# (10-minute polls, collected only), satellite observations (GEE).
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish even if the data-quality gate refuses (intended changes only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_KEY: ${{ secrets.R2_KEY }}
      R2_SECRET: ${{ secrets.R2_SECRET }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-pipeline.txt -e .
      - name: pull inputs from R2
        run: |
          python -m pipeline.storage pull obs/imgw_hourly/ obs/imgw_daily/ obs/imerg/ obs/modis_terra/ obs/modis_aqua/
          for k in 0 1 2 3 4; do python -m pipeline.storage pull "obs/imgw_raw/$(date -u -d "-$k day" +%F)/"; done
          python -m pipeline.storage pull obs/imgw_meteo_stations.json
          for k in 0 1 2; do python -m pipeline.storage pull "obs/imgw_meteo_raw/$(date -u -d "-$k day" +%F)/"; done
          for k in 0 1 2 3 4; do
            d=$(date -u -d "-$k day" +%F)
            python -m pipeline.storage pull "obs/imgw_meteo_10min/$d.parquet" "obs/imgw_meteo_daily/$d.parquet"
          done
      - name: IMGW daily Tmax/Tmin (last 3 days, late polls included)
        run: |
          python -m pipeline.ingest.imgw ingest-raw
          for k in 1 2 3; do
            python -m pipeline.ingest.imgw daily --date "$(date -u -d "-$k day" +%F)"
          done
      - name: IMGW automatic stations (10-minute polls -> daily; precipitation 06-06 UTC complete for D-2)
        run: |
          python -m pipeline.ingest.imgw_meteo ingest-raw
          for k in 1 2 3; do
            python -m pipeline.ingest.imgw_meteo daily --date "$(date -u -d "-$k day" +%F)"
          done
          python -m pipeline.storage prune obs/imgw_meteo_raw/ --keep-days 14
      - name: IMGW monthly archives (previous two months; skipped until published)
        run: |
          for k in 1 2; do
            python -m pipeline.ingest.imgw archive --year "$(date -u -d "$(date -u +%Y-%m-15) -$k month" +%Y)" \
                                                   --month "$(date -u -d "$(date -u +%Y-%m-15) -$k month" +%-m)"
          done
      - name: satellite observations (GEE)
        if: env.GEE_SERVICE_ACCOUNT_JSON != ''
        run: python -m pipeline.ingest.satellite
      - name: verification and ranking (30-day window ending D-2)
        run: |
          python -m pipeline.storage pull forecasts/
          python -m pipeline.verify.run
      - name: publish rankings for the web host (data-quality gate, SPEC §12)
        run: python -m pipeline.publish ${{ inputs.force_publish && '--force' || '' }}
      - name: push results to R2
        if: always()
        run: python -m pipeline.storage push
